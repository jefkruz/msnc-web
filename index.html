<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MSNC Recruitment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.missionsupportnetworkcenter.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.missionsupportnetworkcenter.org" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      />
    </noscript>
    <style>
      .page-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f8fc}
      html.dark .page-loader{background:#0b1220}
      .page-loader__mark{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center}
      .page-loader__ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(19,109,236,.18);border-top-color:#136dec;animation:page-loader-spin .75s linear infinite}
      .page-loader__logo{width:44px;height:44px;object-fit:contain}
      @keyframes page-loader-spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      (function () {
        try {
          var fav = localStorage.getItem('msnc_favicon');
          if (fav) {
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.setAttribute('href', fav);
          }
        } catch (e) {}
        try {
          var t = localStorage.getItem('mca_theme') || localStorage.getItem('theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="page-loader" role="status" aria-live="polite">
        <div class="page-loader__mark">
          <span class="page-loader__ring" aria-hidden="true"></span>
          <img src="/logo.png" alt="" class="page-loader__logo" width="44" height="44" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
